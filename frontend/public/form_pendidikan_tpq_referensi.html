<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Pendidikan TPQ</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:#f3f6fb;color:#182230;font:16px system-ui,sans-serif}.wrap{max-width:820px;margin:auto}h1{margin:0 0 8px}p,small{color:#64748b;line-height:1.5}.card{background:#fff;border:1px solid #dce3ed;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:14px;font-weight:650}input,select,textarea{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%}textarea{min-height:80px}.options{display:flex;gap:14px;flex-wrap:wrap}.options label{font-weight:500}.options input{width:auto}.btn{padding:12px 17px;border:0;border-radius:9px;background:#155eef;color:white;font-weight:700;cursor:pointer}.notice{display:none;padding:12px;border-radius:9px;margin-top:14px}.bad{background:#fff1f2;color:#9f1239}.good{background:#ecfdf3;color:#166534}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}}
</style></head><body><div class="wrap"><h1>Pengajuan Pendidikan TPQ</h1><p>Form khusus program pendidikan TPQ. Target Peserta dan Kuota telah dihapus.</p><main class="card"><form id="form"><div class="grid">
<div class="field full"><label>Nama Program / Event *</label><input id="nama" required></div>
<div class="field"><label>Kategori / Fokus *</label><select id="kategori" required><option value="">Pilih</option><option>Pelatihan</option><option>ToT</option><option>lomba</option><option>dll</option></select></div>
<div class="field"><label>Jenis Disabilitas *</label><select id="disabilitas" required><option value="">Pilih</option><option>Fisik</option><option>Sensorik</option><option>Intelektual</option><option>Psikososial</option><option>Semua ragam disabilitas</option></select></div>
<div class="field full"><label>Deskripsi</label><textarea id="deskripsi"></textarea></div>
<div class="field full"><label>Durasi Program *</label><input id="durasi" required value="Program 3 Minggu" placeholder="Program 3 Minggu"><small>Template: <strong>Durasi = Program 3 Minggu</strong>. Isi angka dan satuan, misalnya Program 2 Bulan.</small></div>
<div class="field"><label>Tanggal Mulai *</label><input type="date" id="mulai" required></div><div class="field"><label>Tanggal Selesai *</label><input type="date" id="selesai" required></div>
<div class="field"><label>Lokasi *</label><input id="lokasi" required></div><div class="field"><label>Alamat *</label><input id="alamat" required></div>
<div class="field"><label>Provinsi *</label><select id="provinsi" required onchange="updateCities()"><option value="">Pilih provinsi</option></select></div><div class="field"><label>Kota / Kabupaten *</label><select id="kota" required disabled><option>Pilih provinsi dahulu</option></select></div>
<div class="field full"><label>Koordinat</label><input id="koordinat" placeholder="-6.200000, 106.816666"></div><div class="field full"><label>Benefit</label><textarea id="benefit"></textarea></div><div class="field"><label>Batas Pendaftaran *</label><input type="date" id="batas" required></div>
</div><div id="notice" class="notice"></div><p><button class="btn" type="submit">Validasi Form</button></p></form></main><p><small>Mockup frontend saja. Dropdown kota/kabupaten masih contoh dan perlu dataset lengkap.</small></p></div><script>
const provinces=['Aceh','Sumatera Utara','Sumatera Barat','Riau','Kepulauan Riau','Jambi','Sumatera Selatan','Kepulauan Bangka Belitung','Bengkulu','Lampung','DKI Jakarta','Banten','Jawa Barat','Jawa Tengah','DI Yogyakarta','Jawa Timur','Bali','Nusa Tenggara Barat','Nusa Tenggara Timur','Kalimantan Barat','Kalimantan Tengah','Kalimantan Selatan','Kalimantan Timur','Kalimantan Utara','Sulawesi Utara','Gorontalo','Sulawesi Tengah','Sulawesi Barat','Sulawesi Selatan','Sulawesi Tenggara','Maluku','Maluku Utara','Papua','Papua Barat','Papua Selatan','Papua Tengah','Papua Pegunungan','Papua Barat Daya'];
const sample={'Jawa Barat':['Bandung','Bogor','Bekasi','Depok','Cirebon','Sukabumi','Tasikmalaya','Cianjur'],'DKI Jakarta':['Jakarta Pusat','Jakarta Utara','Jakarta Barat','Jakarta Selatan','Jakarta Timur'],'Jawa Tengah':['Semarang','Surakarta','Magelang','Tegal'],'Banten':['Serang','Tangerang','Cilegon','Tangerang Selatan'],'Jawa Timur':['Surabaya','Malang','Kediri','Madiun']};
const ps=document.getElementById('provinsi');provinces.forEach(p=>ps.add(new Option(p,p)));
function updateCities(){const s=document.getElementById('kota'),p=ps.value;s.innerHTML='';s.disabled=!p;s.add(new Option(p?'Pilih kota/kabupaten':'Pilih provinsi dahulu',''));(sample[p]||(p?['Dataset kota/kabupaten resmi perlu dihubungkan']:[])).forEach(c=>s.add(new Option(c,c)))}
function showErrors(errors){const n=document.getElementById('notice');n.className='notice '+(errors.length?'bad':'good');n.textContent=errors.length?errors.join(' '):'Validasi dasar berhasil. Mockup belum mengirim atau menyimpan data.';n.style.display='block'}

function plusMonths(s,n){let d=new Date(s+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d}
function dateErr(){let s=mulai.value,e=selesai.value,d=document.getElementById('durasi').value.trim();if(!s||!e)return '';let m=d.match(/^(?:program\s*)?(\d+)\s*(hari|minggu|bulan|tahun)$/i);if(!m||Number(m[1])<1)return 'Format durasi harus seperti Program 3 Minggu.';let a=new Date(s+'T00:00:00'),b=new Date(e+'T00:00:00'),max=new Date(a),n=Number(m[1]),u=m[2].toLowerCase();if(u==='hari')max.setDate(max.getDate()+n-1);else if(u==='minggu')max.setDate(max.getDate()+n*7-1);else if(u==='bulan'){max=plusMonths(s,n);max.setDate(max.getDate()-1)}else{max.setFullYear(max.getFullYear()+n);max.setDate(max.getDate()-1)}if(b<a)return 'Tanggal selesai tidak boleh sebelum tanggal mulai.';if(b>max)return 'Tanggal selesai melewati durasi '+d+'. Maksimal '+max.toLocaleDateString('id-ID')+'.';return ''}
function updateEndLimit(){let s=mulai.value,d=document.getElementById('durasi').value.trim(),m=d.match(/^(?:program\s*)?(\d+)\s*(hari|minggu|bulan|tahun)$/i);selesai.min=s||'';selesai.removeAttribute('max');if(!s||!m)return;let x=new Date(s+'T00:00:00'),n=Number(m[1]),u=m[2].toLowerCase();if(u==='hari')x.setDate(x.getDate()+n-1);else if(u==='minggu')x.setDate(x.getDate()+n*7-1);else if(u==='bulan'){x=plusMonths(s,n);x.setDate(x.getDate()-1)}else{x.setFullYear(x.getFullYear()+n);x.setDate(x.getDate()-1)}selesai.max=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
mulai.addEventListener('change',updateEndLimit);document.getElementById('durasi').addEventListener('input',updateEndLimit);
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let errors=[];['nama','kategori','disabilitas','mulai','selesai','lokasi','alamat','provinsi','kota','batas'].forEach(id=>{if(!document.getElementById(id).value)errors.push(id+' wajib diisi.')});let de=dateErr();if(de)errors.push(de);if(batas.value&&mulai.value&&batas.value>mulai.value)errors.push('Batas pendaftaran tidak boleh melewati tanggal mulai.');showErrors(errors)});
</script></body></html>

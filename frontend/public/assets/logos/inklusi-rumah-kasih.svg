<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#FFFFFF" rx="16" />

  <g transform="translate(10, 10)">
    <!-- Outer Magenta House / Kite Frame -->
    <path
      d="M 90 20 L 160 85 L 145 92 L 145 140 L 90 175 L 35 140 L 35 92 L 20 85 Z"
      fill="none"
      stroke="#D91B7F"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Three Petal Golden Lotus / Flame at top center -->
    <g transform="translate(90, 58)">
      <!-- Center Petal -->
      <path d="M 0 -16 C -5 -8 -4 4 0 8 C 4 4 5 -8 0 -16 Z" fill="#FACC15" />
      <!-- Left Petal -->
      <path d="M -2 -12 C -10 -4 -8 6 -2 8 C 0 4 -2 -6 -2 -12 Z" fill="#EAB308" />
      <!-- Right Petal -->
      <path d="M 2 -12 C 10 -4 8 6 2 8 C 0 4 2 -6 2 -12 Z" fill="#EAB308" />
    </g>

    <!-- Two Pink Heads of Caring Figures -->
    <circle cx="68" cy="68" r="7" fill="#D91B7F" />
    <circle cx="112" cy="68" r="7" fill="#D91B7F" />

    <!-- Embracing Heart Shape in Center -->
    <!-- Yellow Heart Core -->
    <path
      d="M 90 125 C 72 108 55 92 55 78 C 55 68 62 62 72 62 C 80 62 86 68 90 74 C 94 68 100 62 108 62 C 118 62 125 68 125 78 C 125 92 108 108 90 125 Z"
      fill="#FACC15"
    />

    <!-- Magenta Embracing Arms Interlocking -->
    <path
      d="M 64 78 C 64 96 82 114 90 122 C 98 114 116 96 116 78 C 116 70 110 65 104 65 C 97 65 92 72 90 78 C 88 72 83 65 76 65 C 70 65 64 70 64 78 Z"
      fill="none"
      stroke="#D91B7F"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bottom interlocking Ribbon Loop in Magenta -->
    <path
      d="M 62 135 L 90 156 L 118 135"
      fill="none"
      stroke="#D91B7F"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
